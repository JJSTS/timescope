## CORS
cors.allowed-origins=${CORS_ORIGINS:https://timescope-app.vercel.app}

## PostgreSQL - Production (Railway)
spring.datasource.url=${JDBC_URL}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

## HikariCP - evitar conexiones muertas en Railway
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-test-query=SELECT 1

spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false
spring.jpa.show-sql=false

## JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400

rutaFront=${FRONTEND_URL:https://timescope-app.vercel.app/dashboard}

## Email
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.ssl.enable=true
app.mail.from=${MAIL_FROM:info@timescope.org}
spring.mail.default-encoding=UTF-8
